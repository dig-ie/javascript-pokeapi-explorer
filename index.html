<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- CSS Normalize -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/normalize.css" />
    <!-- CSS -->
    <link rel="stylesheet" type="text/css" href="./assets/global.css" />
    <link rel="stylesheet" type="text/css" href="./assets/pokedex.css" />
    <!-- Bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <section class="pageContent">
      <h1 id="titlePokedex">Pokedex</h1>
      <p>
        Explore centenas de Pokémon e pesquise seu favorito pelo nome. Descubra
        tipos, características e muito mais da primeira geração!
      </p>
      <div id="container-searchBarMainPage" class="container-fluid">
        <input
          class="form-control"
          type="search"
          id="searchInput"
          placeholder="Pesquise um Pokemon"
          aria-label="Search"
        />
      </div>
      <ol class="pokemonsOl" id="pokemonsList"></ol>
      <div id="divBtnLoadMore">
        <button type="button" class="btn btn-primary" id="btnLoadMore">
          Carregar +
        </button>
      </div>
    </section>

    <!-- scripts -->
    <script src="./source/pokemon-model.js"></script>
    <script src="./source/poke-api.js"></script>
    <script src="./source/main.js"></script>
  </body>
</html>
